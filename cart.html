<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Cornerstore</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            <a href="register.html">Create an account</a>
        </nav>
    </header>
    <main>
        <h2>Your cart</h2>
        <table>
            <caption>Items in your cart</caption>
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
            </thead>
            <tbody id="cart-rows"></tbody>
            <tfoot>
                <tr>
                    <th colspan="3">Shipping</th>
                    <td id="shipping">Free</td>
                </tr>
                <tr>
                    <th colspan="3">Order total</th>
                    <td id="total">$0</td>
                </tr>
            </tfoot>
        </table>
        <p><a href="checkout.html">Go to checkout</a></p>
    </main>
    <footer>
        <p>Cornerstore, built during the AI-Native Full Stack course.</p>
    </footer>
    <script type="module" src="js/cart-page.js"></script>
</body>
</html>
